name: 构建 Apple 安装包

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号
        required: true
        default: '1.0.2'
        type: string
      build_number:
        description: 构建号
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-arm64-standard
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios }
          - { platform: macos }
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build_number }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 检查版本输入
        run: |
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw '版本号必须为数字组成的 x.y.z。'
          }
          if ($env:RELEASE_BUILD -notmatch '^[1-9][0-9]{0,8}$') {
            throw '构建号必须为 1 至 9 位正整数。'
          }

      - name: 安装固定 Flutter SDK
        run: |
          $flutterDir = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.41.6 https://github.com/flutter/flutter.git $flutterDir
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK 下载失败。' }
          $flutterBin = Join-Path $flutterDir 'bin'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $flutterBin -Encoding utf8
          & (Join-Path $flutterBin 'flutter') --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK 初始化失败。' }

      - name: 安装项目依赖
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter 项目依赖安装失败。' }

      - name: 注入凭据并构建
        env:
          DANDANPLAY_CONFIG_JSON: ${{ secrets.DANDANPLAY_CONFIG_JSON }}
        run: |
          $definesPath = Join-Path $env:RUNNER_TEMP 'defines.json'
          $keys = @('DANDANPLAY_APP_ID', 'DANDANPLAY_APP_SECRET', 'DANDANPLAY_APP_SECRET_FALLBACK')
          try {
            try { $config = ConvertFrom-Json -InputObject $env:DANDANPLAY_CONFIG_JSON -AsHashtable }
            catch { throw 'DANDANPLAY_CONFIG_JSON 必须是有效 JSON。' }
            $defines = @{}
            foreach ($key in $keys) {
              $value = [string]$config[$key]
              if ($value) {
                $masked = $value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::add-mask::$masked"
              }
              if ($value -match '[\r\n]' -or ($key -ne 'DANDANPLAY_APP_SECRET_FALLBACK' -and [string]::IsNullOrWhiteSpace($value))) {
                throw "缺少或无效的构建配置：$key"
              }
              $defines[$key] = $value.Trim()
              if ($defines[$key]) { Write-Output "::add-mask::$($defines[$key])" }
              # Flutter/Xcode 的诊断可能使用 Base64 编码后的 Dart 定义。
              $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$key=$($defines[$key])"))
              Write-Output "::add-mask::$encoded"
            }
            $defines | ConvertTo-Json -Compress | Set-Content -LiteralPath $definesPath -Encoding utf8NoBOM
            flutter test --no-pub --dart-define-from-file $definesPath test/danmaku/dandanplay_apple_config_test.dart
            if ($LASTEXITCODE -ne 0) { throw 'Apple 弹幕凭据编译验证失败。' }
            $buildArgs = @('--release', '--no-pub', '--build-name', $env:RELEASE_VERSION, '--build-number', $env:RELEASE_BUILD,
              '--dart-define-from-file', $definesPath)
            if ($env:BUILD_PLATFORM -eq 'ios') {
              # --no-codesign：云端无证书，产出未签名包，侧载时再签名。
              flutter build ios @buildArgs --no-codesign
            } else {
              flutter build macos @buildArgs
            }
            if ($LASTEXITCODE -ne 0) { throw 'Apple 安装包构建失败。' }
          } finally {
            Remove-Item -LiteralPath $definesPath -Force -ErrorAction SilentlyContinue
          }

      - name: 打包并生成校验信息
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $name = "fly-player-$env:RELEASE_VERSION-$env:RELEASE_BUILD-$env:BUILD_PLATFORM-arm64-standard"
          if ($env:BUILD_PLATFORM -eq 'ios') {
            $app = 'build/ios/iphoneos/Runner.app'
            if (-not (Test-Path "$app/Runner")) { throw '未找到 iOS 主程序。' }
            # 未签名 ipa 采用 Payload/Runner.app 结构，供爱思助手、Sideloadly、AltStore 等工具重新签名侧载。
            # ditto/zip 保留可执行权限与符号链接，PowerShell 的 Compress-Archive 会破坏它们。
            $staging = Join-Path $env:RUNNER_TEMP 'payload/Payload'
            New-Item -ItemType Directory -Path $staging -Force | Out-Null
            & ditto $app (Join-Path $staging 'Runner.app')
            if ($LASTEXITCODE -ne 0) { throw '复制 iOS 主程序失败。' }
            $package = Join-Path $dist "$name.unsigned.ipa"
            Push-Location (Split-Path $staging)
            try {
              & zip -qry9 $package Payload
              if ($LASTEXITCODE -ne 0) { throw 'IPA 打包失败。' }
            } finally { Pop-Location }
          } else {
            $bundle = 'build/macos/Build/Products/Release/fly_player.app'
            if (-not (Test-Path "$bundle/Contents/MacOS/fly_player")) { throw '未找到 macOS 主程序。' }
            $package = Join-Path $dist "$name.zip"
            & ditto -c -k --sequesterRsrc --keepParent $bundle $package
            if ($LASTEXITCODE -ne 0) { throw 'macOS 应用包打包失败。' }
          }
          if ($env:BUILD_PLATFORM -eq 'ios') {
            @('飞翔播放器 iOS arm64 未签名安装包。',
              '未签名 ipa 无法直接安装，也不能上传 App Store 或 TestFlight。',
              '常用安装方式：',
              '1. 爱思助手、Sideloadly 或 AltStore 用个人 Apple ID 重新签名后侧载；',
              '   免费 Apple ID 签名有效期 7 天，到期需重新签名。',
              '2. 持有 Apple 开发者账号（99 美元/年）时，可用开发者证书签名后长期安装。') |
              Set-Content -LiteralPath (Join-Path $dist "$name.readme.txt") -Encoding utf8NoBOM
          } else {
            @('飞翔播放器 macOS arm64（Apple Silicon）应用包。',
              '解压得到 fly_player.app，拖入「应用程序」文件夹使用。',
              '应用未经 Apple 公证，首次打开被拦截时：',
              '在应用图标上右键选择「打开」，或在终端执行：xattr -cr /Applications/fly_player.app。',
              '首次连接 NAS 时，请在系统提示中允许「本地网络」权限。') |
              Set-Content -LiteralPath (Join-Path $dist "$name.readme.txt") -Encoding utf8NoBOM
          }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content -LiteralPath "$package.sha256" -Encoding utf8NoBOM
          @("版本：$env:RELEASE_VERSION+$env:RELEASE_BUILD", "源码提交：$env:GITHUB_SHA",
            'Flutter：3.41.6', "目标：$env:BUILD_PLATFORM arm64 standard（未签名）") |
            Set-Content -LiteralPath (Join-Path $dist "$name.build-info.txt") -Encoding utf8NoBOM

      - name: 上传构建产物（不创建 Release）
        uses: actions/upload-artifact@v4
        with:
          name: fly-player-${{ inputs.version }}-${{ inputs.build_number }}-${{ matrix.platform }}-arm64-standard
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
